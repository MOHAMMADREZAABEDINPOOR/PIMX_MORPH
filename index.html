<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const savedTheme = localStorage.getItem('offline_converter_theme');
        const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.backgroundColor = theme === 'dark' ? '#16181c' : '#f5f5f0';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        const language = new URLSearchParams(location.search).get('lang') || localStorage.getItem('offline_converter_lang') || 'en';
        if (['en','fa','ru','zh','fr','it','de','ar','la','el'].includes(language)) { document.documentElement.lang = language; document.documentElement.dir = language === 'fa' || language === 'ar' ? 'rtl' : 'ltr'; }
      } catch (_) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PIMX MORPH — A little change. A whole new file.</title>
    <meta name="description" content="A local studio for your files. Convert images, PDFs, documents, audio and video on your device. Install MORPH and use downloaded tools offline." />
    <meta name="author" content="Mohammad Reza Abedinpoor" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="PIMX MORPH" />
    <meta name="apple-mobile-web-app-title" content="MORPH" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://pimxmorph.pages.dev/" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PIMX MORPH" />
    <meta property="og:title" content="A little change. A whole new file. | PIMX MORPH" />
    <meta property="og:description" content="Your files, in the right format. A private file studio that stays with you, even offline." />
    <meta property="og:url" content="https://pimxmorph.pages.dev/" />
