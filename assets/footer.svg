<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060f" />
      <stop offset="50%" stop-color="#0a0f24" />
      <stop offset="100%" stop-color="#04060f" />
    </linearGradient>

    <linearGradient id="footerNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="140" fill="url(#footerBg)" />

  <!-- Top Glowing Border Line -->
  <line x1="0" y1="2" x2="1200" y2="2" stroke="url(#footerNeon)" stroke-width="3" filter="url(#glowF)" />

  <!-- Isometric Cyber Grid Accent -->
  <g opacity="0.35">
    <line x1="600" y1="2" x2="100" y2="140" stroke="#00f0ff" stroke-width="1" />
    <line x1="600" y1="2" x2="350" y2="140" stroke="#00f0ff" stroke-width="1" />
    <line x1="600" y1="2" x2="600" y2="140" stroke="#a855f7" stroke-width="1" />
    <line x1="600" y1="2" x2="850" y2="140" stroke="#ff0080" stroke-width="1" />
    <line x1="600" y1="2" x2="1100" y2="140" stroke="#ff0080" stroke-width="1" />
  </g>

  <!-- Centered Branding Text -->
  <text x="600" y="55" font-family="'Segoe UI', -apple-system, sans-serif" font-size="20" font-weight="900" fill="url(#footerNeon)" text-anchor="middle" letter-spacing="3" filter="url(#glowF)">
    PIMX ECOSYSTEM // DECENTRALIZED COGNITION &amp; SECURITY
  </text>
  <text x="600" y="85" font-family="'Fira Code', monospace" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Architected &amp; Vibe Coded with high-leverage AI choreography by MOHAMMADREZA ABEDINPOOR
  </text>
  <text x="600" y="112" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00f0ff" text-anchor="middle" opacity="0.8">
    ★ STAR THIS REPOSITORY ON GITHUB IF IT ACCELERATES YOUR WORKFLOW ★
  </text>
</svg>